[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidcomp"
version = "0.0.1"
authors = [
  { name="Evgeniy Blinov", email="zheni-b@yandex.ru" },
]
description = 'Run throng commands on Liquid Compute'
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    'throng>=0.0.10',
    'cantok>=0.0.42',
    'pristan>=0.0.24',
    'skelet>=0.0.21',
    'httpx>=0.27,<1',
    'keyring>=24.3,<26',
    'pathspec>=0.12,<1',
    'semver>=3,<4',
]
classifiers = [
    "Operating System :: OS Independent",
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'License :: Free for non-commercial use',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries',
    'Typing :: Typed',
]
keywords = [
    'subprocesses',
    'subprocesses wrapper',
    'execute commands',
    'isolated environments',
    'sandboxes',
]

[tool.setuptools.package-data]
"liquidcomp" = ["py.typed"]

[project.scripts]
liquid = "liquidcomp.cli:main"

[project.entry-points.throng]
liquid = "liquidcomp.plugin"

[tool.setuptools.packages.find]
include = ["liquidcomp*"]

[tool.mutmut]
paths_to_mutate=["liquidcomp"]

[tool.coverage.run]
branch = "${LIQUIDCOMP_COVERAGE_BRANCH-false}"
omit = ["*tests*"]
parallel = true
plugins = ["coverage_pyver_pragma"]
source = ["liquidcomp"]

[tool.pytest.ini_options]
norecursedirs = ["build", "mutants"]

[tool.ruff]
lint.ignore = ['E501', 'E712', 'PTH123', 'PTH118', 'PLR2004', 'PTH107', 'SIM105', 'SIM102', 'RET503', 'PLR0912', 'C901', 'E731', 'F821']
lint.select = ["ERA001", "YTT", "ASYNC", "BLE", "B", "A", "COM", "INP", "PIE", "T20", "PT", "RSE", "RET", "SIM", "SLOT", "TID252", "ARG", "PTH", "I", "C90", "N", "E", "W", "D201", "D202", "D419", "F", "PL", "PLE", "PLR", "PLW", "RUF", "TRY201", "TRY400", "TRY401"]
lint.isort.combine-as-imports = true
format.quote-style = "single"

# Pytest fixtures and mock callbacks are intentionally requested for side effects.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG005", "PLR0913"]

[project.urls]
'Source' = 'https://github.com/mutating/liquidcomp'
'Tracker' = 'https://github.com/mutating/liquidcomp/issues'
